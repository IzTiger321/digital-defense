<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panduan Pertahanan Digital · Digital Defense Guide (Malaysia)</title>
<meta name="description" content="Panduan keselamatan digital dan persediaan gangguan internet untuk rakyat Malaysia. Digital safety and internet-blackout guide for Malaysians. BM / EN.">
<style>
:root{--bg:#f4f5f7;--ink:#0d1b3d;--mut:#55627a;--line:#0d1b3d;--y:#ffc400;--r:#c8102e;--w:#fff;--ok:#0b7a4b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;grid-template-rows:auto 1fr auto;height:100dvh;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;cursor:pointer;border-radius:4px}
:focus-visible{outline:3px solid var(--y);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
a{color:var(--ink);font-weight:700}
header{background:var(--ink);color:#fff;border-bottom:5px solid var(--y);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
header b{font-size:1.02rem;letter-spacing:.01em;flex:1 1 200px}
header b small{display:block;font-weight:400;font-size:.76rem;opacity:.8}
.hb{display:flex;gap:6px;align-items:center}
.hb button{background:transparent;border:2px solid #fff;color:#fff;padding:5px 11px;font-size:.86rem;font-weight:700}
.hb .r{background:var(--r);border-color:var(--r)}
.lg{display:flex}.lg button{border-radius:0}.lg button:first-child{border-radius:4px 0 0 4px}.lg button:last-child{border-radius:0 4px 4px 0;border-left:0}
.lg button[aria-pressed=true]{background:var(--y);border-color:var(--y);color:var(--ink)}
main{overflow:auto;padding:18px 16px;max-width:760px;width:100%;margin:0 auto}
h1{font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.1;margin:6px 0 12px;font-weight:800}
h2{font-size:clamp(1.4rem,5vw,2rem);line-height:1.15;margin:8px 0 10px;font-weight:800}
.lead{color:var(--mut);margin:0 0 18px}
.lab{font-weight:800;font-size:.9rem;margin:16px 0 8px}
.opt{display:block;width:100%;text-align:left;background:var(--w);border:2px solid var(--line);padding:12px 14px;margin:0 0 10px}
.opt[aria-pressed=true]{background:var(--y)}
.opt b{display:block}.opt span{font-size:.88rem;color:#2c3a57}
.seg{display:flex;gap:3px;margin-bottom:10px}.seg i{flex:1;height:7px;background:#cfd5df}.seg i.d{background:var(--ok)}.seg i.c{background:var(--y);outline:2px solid var(--ink)}
.meta{display:flex;justify-content:space-between;font-weight:700;font-size:.88rem;color:var(--mut);margin:0}
.why{font-size:1.08rem;margin:0 0 14px;padding-left:12px;border-left:5px solid var(--y)}
ol{margin:0;padding-left:22px}li{margin:9px 0}
.bar{background:var(--w);border-top:2px solid var(--line);padding:10px 14px;display:flex;gap:8px;justify-content:center}
.bar>div{display:flex;gap:8px;max-width:760px;width:100%}
.bt{background:var(--w);border:2px solid var(--line);padding:11px 14px;font-weight:700}
.bt.p{background:var(--ink);color:#fff;flex:1}
.bt.y{background:var(--y);flex:1}
#o{position:fixed;inset:0;background:rgba(13,27,61,.82);display:none;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;z-index:9}
#o.on{display:block}
.pop{max-width:640px;margin:0 auto;background:var(--w);border:3px solid var(--ink);padding:18px;position:relative}
.pop.e{border-color:var(--r)}
.x{position:absolute;right:10px;top:10px;background:var(--w);border:2px solid var(--ink);width:38px;height:38px;font-weight:800}
.pop h2{margin-right:44px}
.num{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;border-top:1px solid #c9d0db;padding:9px 0}
.num a{background:var(--r);color:#fff;text-decoration:none;text-align:center;font-size:1.2rem;padding:8px 4px;border-radius:4px}
.num a.k{background:var(--ink)}
.num small{display:block;color:var(--mut)}
.ph{margin:16px 0 4px;font-size:.95rem;background:var(--ink);color:#fff;padding:4px 10px}
.li{display:flex;gap:10px;width:100%;text-align:left;background:var(--w);border:0;border-bottom:1px solid #c9d0db;padding:9px 4px;border-radius:0}
.li span{width:20px;color:var(--ok);font-weight:800}.li.on{color:var(--mut)}
.s3{display:flex;gap:6px;flex-wrap:wrap}.s3 button{flex:1 1 90px;background:var(--w);border:2px solid var(--ink);padding:8px 6px;font-size:.85rem;font-weight:700}.s3 button[aria-pressed=true]{background:var(--y)}
.soc{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:10px 0}
.soc a{border:2px solid var(--ink);padding:8px 10px;text-decoration:none;overflow-wrap:anywhere;background:var(--w)}
.note{font-size:.82rem;color:var(--mut)}
@media(prefers-reduced-motion:no-preference){main{scroll-behavior:smooth}}
</style>

<script>
var T={ti:["Digital Defense Guide<small>Online safety and internet-blackout readiness for Malaysians</small>","Panduan Pertahanan Digital<small>Keselamatan dalam talian dan persediaan gangguan internet untuk rakyat Malaysia</small>"],
hp:["Help","Bantuan"],eb:["Emergency","Kecemasan"],
wh:["Stay safe online, one step at a time.","Selamat dalam talian, satu langkah demi satu langkah."],
wl:["No technical skills needed. You see one step at a time, so there is nothing to scroll through. Pick who this is for.","Tidak perlu pandai teknologi. Anda hanya nampak satu langkah pada satu masa. Pilih untuk siapa panduan ini."],
lv:["Your level","Tahap anda"],st:["Start","Mula"],ct:["Continue","Teruskan"],
bk:["Back","Kembali"],al:["All steps","Semua langkah"],sk:["Skip","Langkau"],dn:["Done, next","Siap, seterusnya"],
of:["of","daripada"],cl:["Close","Tutup"],
fh:["All done for this level.","Semua langkah tahap ini siap."],
fl:["Well done. Each step you finished makes you harder to scam or hack. Repeat the check every few months.","Syabas. Setiap langkah yang siap menjadikan anda lebih sukar ditipu atau digodam. Ulang semakan setiap beberapa bulan."],
up:["Go to the next level","Naik ke tahap seterusnya"],
eh:["Emergency numbers","Nombor kecemasan"],
sc:["Just scammed or hacked? Do this now","Baru kena tipu atau digodam? Buat ini sekarang"],
ss:["1. Call 997 (NSRC) and your bank’s hotline right away. Fast reports can freeze the money.|2. Switch on your bank app’s kill switch.|3. Do not reply to or pay the scammer again.|4. Lodge a police report afterwards.","1. Hubungi 997 (NSRC) dan talian bank anda segera. Laporan cepat boleh membekukan wang.|2. Hidupkan kill switch dalam aplikasi bank.|3. Jangan balas atau bayar penipu lagi.|4. Buat laporan polis selepas itu."],
en:["Numbers can change. Confirm on official sites. 112 also works from a mobile phone.","Nombor boleh berubah. Sahkan di laman rasmi. 112 juga boleh dihubungi melalui telefon bimbit."],
hh:["Need help? Send me a DM","Perlukan bantuan? Hantar DM kepada saya"],
hn:["Never send passwords, TAC or recovery codes to anyone, including me. This is general guidance, not legal or professional advice. Menus differ by phone brand; search settings for the bold word. Tip: save this page (browser menu › Save page) so you have it during a blackout.","Jangan hantar kata laluan, TAC atau kod pemulihan kepada sesiapa, termasuk saya. Ini panduan umum, bukan nasihat guaman atau profesional. Menu berbeza mengikut jenama telefon; cari perkataan tebal dalam tetapan. Petua: simpan halaman ini (menu pelayar › Save page) supaya anda ada semasa gangguan."]};
var LV=[["Beginner","Pemula"],["Phones and apps confuse me. Just the essentials.","Telefon dan aplikasi mengelirukan saya. Perkara penting sahaja."]],
LV2=[[["Beginner","Pemula"],["Phones and apps confuse me. Just the essentials.","Telefon dan aplikasi mengelirukan saya. Perkara penting sahaja."]],[["Everyday user","Pengguna biasa"],["I can follow settings menus.","Saya boleh ikut menu tetapan."]],[["High-risk or professional","Berisiko tinggi atau profesional"],["Journalist, public servant, influencer, first responder.","Wartawan, penjawat awam, pempengaruh, pasukan penyelamat."]]];
var PH=[["Basics","Asas"],["Level up","Mantap"],["Hardened","Tegap"],["Blackout and floods","Gangguan dan banjir"]];
/* [phase, level, [title EN,BM], [why EN,BM], [steps EN,BM]] steps split by | */
var D=[
[0,1,["Turn on automatic updates","Hidupkan kemas kini automatik"],["Updates close the security holes criminals use. Old phones and apps are the easiest to attack.","Kemas kini menutup lubang keselamatan yang digunakan penjenayah. Telefon dan aplikasi lama paling mudah diserang."],["iPhone: Settings › General › Software Update › Automatic Updates.|Android: Settings › System › Software update, and turn on auto-update in Play Store.|Restart when asked. Do not keep postponing.","iPhone: Tetapan › Umum › Kemas Kini Perisian › Kemas Kini Automatik.|Android: Tetapan › Sistem › Kemas kini perisian, dan hidupkan auto-kemas kini di Play Store.|Mulakan semula bila diminta. Jangan tangguh-tangguh."]],
[0,1,["Set a strong screen lock","Tetapkan kunci skrin yang kuat"],["If your phone is lost or snatched, the lock is all that protects your bank app and chats.","Jika telefon hilang atau diragut, kunci skrin sahaja yang melindungi aplikasi bank dan sembang anda."],["Use 6 digits or more. Not 123456, 000000, your birth year or the last digits of your IC.|Turn on Face ID or fingerprint, and auto-lock at 1 minute.|Never tell anyone your passcode, even someone who says they are from the bank or police.","Guna 6 digit atau lebih. Bukan 123456, 000000, tahun lahir atau digit akhir IC.|Hidupkan Face ID atau cap jari, dan kunci automatik 1 minit.|Jangan beritahu sesiapa kod anda, walaupun mengaku dari bank atau polis."]],
[0,1,["Use a password manager","Guna pengurus kata laluan"],["Reusing one password turns one leak into many hacked accounts. A manager remembers them for you.","Guna kata laluan yang sama menjadikan satu kebocoran sebagai banyak akaun digodam. Pengurus kata laluan mengingatinya untuk anda."],["Use the built-in one (iCloud Keychain or Google Password Manager) or install Bitwarden.|Make one long master password from 4 or 5 random words, for example <b>lampu-sungai-kucing-hujan</b>. Write it on paper and keep it at home.|Change your email and banking passwords first.","Guna yang terbina dalam (iCloud Keychain atau Google Password Manager) atau pasang Bitwarden.|Buat satu kata laluan utama yang panjang daripada 4 atau 5 perkataan rawak, contohnya <b>lampu-sungai-kucing-hujan</b>. Tulis atas kertas dan simpan di rumah.|Tukar kata laluan e-mel dan perbankan dahulu."]],
[0,1,["Turn on 2-step verification (email and WhatsApp first)","Hidupkan pengesahan 2 langkah (e-mel dan WhatsApp dahulu)"],["Hijackers take over WhatsApp and Gmail by tricking you into sharing a 6-digit code. A PIN stops them.","Penggodam mengambil alih WhatsApp dan Gmail dengan memperdaya anda berkongsi kod 6 digit. PIN menghalang mereka."],["WhatsApp: Settings › Account › <b>Two-step verification</b> › Enable. Set a PIN and an email.|Google: myaccount.google.com › Security › 2-Step Verification.|Do the same on Facebook, Instagram, TikTok and Apple ID.|Never share a code sent to you, even with a friend. A friend’s hacked account may be the one asking.","WhatsApp: Tetapan › Akaun › <b>Pengesahan dua langkah</b> › Dayakan. Tetapkan PIN dan e-mel.|Google: myaccount.google.com › Keselamatan › Pengesahan 2 Langkah.|Buat yang sama di Facebook, Instagram, TikTok dan Apple ID.|Jangan kongsi kod yang dihantar kepada anda, walaupun kepada rakan. Akaun rakan yang digodam mungkin yang meminta."]],
[0,1,["Spot common Malaysian scams","Kenali penipuan biasa di Malaysia"],["Most losses start with a trick, not a hack. Scammers pretend to be police, LHDN, banks, couriers or friends.","Kebanyakan kerugian bermula dengan tipu daya, bukan godam. Penipu menyamar sebagai polis, LHDN, bank, kurier atau rakan."],["Macau scam: a “police”, “court” or “BNM” officer says you are in trouble. Real agencies never ask you to transfer money or stay on the line.|APK scam: never install an .apk file sent on WhatsApp or Telegram, such as “wedding invitation.apk” or “parcel.apk”. Install apps only from Play Store or App Store.|Check a phone number, bank account or company at <b>semakmule.rmp.gov.my</b> (PDRM) before paying.|Hang up and call the official number yourself. Pressure means scam.","Scam Macau: “polis”, “mahkamah” atau pegawai “BNM” kata anda dalam masalah. Agensi sebenar tidak pernah suruh anda pindah wang atau kekal dalam talian.|Scam APK: jangan pasang fail .apk yang dihantar di WhatsApp atau Telegram, seperti “kad jemputan kahwin.apk” atau “parcel.apk”. Pasang aplikasi dari Play Store atau App Store sahaja.|Semak nombor telefon, akaun bank atau syarikat di <b>semakmule.rmp.gov.my</b> (PDRM) sebelum bayar.|Letak telefon dan hubungi nombor rasmi sendiri. Didesak bermakna penipuan."]],
[0,1,["Lock down your banking app","Kukuhkan keselamatan aplikasi bank"],["Malaysian banks must offer tools that stop a thief emptying your account. They only help if you set them up.","Bank di Malaysia wajib menyediakan alat untuk menghalang pencuri mengosongkan akaun anda. Ia hanya membantu jika anda menetapkannya."],["Approve payments on your device (for example Secure2u or your bank’s secure verification) instead of SMS codes.|Set a low daily online transfer limit. Raise it only when needed.|Find the <b>kill switch</b> or “Safe Switch” in your bank app now, so you know where it is in an emergency.|Turn on alerts for every transaction. Never click links in banking SMS.","Luluskan bayaran pada peranti anda (contohnya Secure2u atau pengesahan selamat bank) dan bukan kod SMS.|Tetapkan had pindahan dalam talian harian yang rendah. Naikkan hanya bila perlu.|Cari <b>kill switch</b> atau “Safe Switch” dalam aplikasi bank sekarang supaya anda tahu lokasinya ketika kecemasan.|Hidupkan notifikasi untuk setiap transaksi. Jangan klik pautan dalam SMS bank."]],
[0,1,["Back up your phone and turn on Find My","Sandarkan telefon dan hidupkan Cari Telefon"],["Phones get lost, dropped in water or ruined in floods. A backup keeps your photos and chats.","Telefon boleh hilang, jatuh dalam air atau rosak dalam banjir. Sandaran menyelamatkan foto dan sembang anda."],["Turn on iCloud Backup (iPhone) or Google Backup (Android).|WhatsApp: Settings › Chats › Chat backup.|Turn on <b>Find My iPhone</b> or <b>Find My Device</b> so you can lock or erase a lost phone.|Once a month, copy photos and documents to a hard disk or thumb drive.","Hidupkan iCloud Backup (iPhone) atau Google Backup (Android).|WhatsApp: Tetapan › Sembang › Sandaran sembang.|Hidupkan <b>Find My iPhone</b> atau <b>Find My Device</b> supaya anda boleh kunci atau padam telefon yang hilang.|Sebulan sekali, salin foto dan dokumen ke cakera keras atau pemacu USB."]],
[1,2,["Use an authenticator app and passkeys","Guna aplikasi pengesah dan passkey"],["SMS codes can be stolen through SIM swaps or fake sites. App codes and passkeys are much harder to steal.","Kod SMS boleh dicuri melalui tukar SIM atau laman palsu. Kod aplikasi dan passkey jauh lebih sukar dicuri."],["Install Aegis, Google Authenticator or Bitwarden.|In each account: Security › 2-step verification › Authenticator app, then scan the QR code.|Create <b>passkeys</b> where offered (Google, Apple, Microsoft, PayPal).|Print the backup codes and keep them at home, not only on your phone.","Pasang Aegis, Google Authenticator atau Bitwarden.|Dalam setiap akaun: Keselamatan › Pengesahan 2 langkah › Aplikasi pengesah, kemudian imbas kod QR.|Cipta <b>passkey</b> jika ditawarkan (Google, Apple, Microsoft, PayPal).|Cetak kod sandaran dan simpan di rumah, bukan hanya dalam telefon."]],
[1,2,["Tighten WhatsApp and Telegram privacy","Ketatkan privasi WhatsApp dan Telegram"],["Scam groups, fake links and linked devices are how many Malaysians lose control of their chats.","Kumpulan penipuan, pautan palsu dan peranti terpaut ialah cara ramai rakyat Malaysia hilang kawalan sembang mereka."],["Privacy › <b>Groups</b>: choose “My contacts” so strangers cannot add you to scam groups.|Turn off auto-download of photos, videos and files.|Settings › <b>Linked devices</b>: log out any device you do not know.|Hide Last seen and profile photo from “Everyone”. Never scan a QR code a stranger sends.","Privasi › <b>Kumpulan</b>: pilih “Kenalan saya” supaya orang asing tidak boleh tambah anda ke kumpulan penipuan.|Matikan muat turun automatik foto, video dan fail.|Tetapan › <b>Peranti terpaut</b>: log keluar mana-mana peranti yang tidak dikenali.|Sembunyikan Last seen dan gambar profil daripada “Semua orang”. Jangan imbas kod QR yang dihantar orang asing."]],
[1,2,["Protect your MyKad and personal data","Lindungi MyKad dan data peribadi"],["Your IC number can open SIM cards, loans and accounts. Leaked copies are used to impersonate you.","Nombor IC anda boleh digunakan untuk kad SIM, pinjaman dan akaun. Salinan yang bocor digunakan untuk menyamar sebagai anda."],["Never post photos of your MyKad, passport, boarding pass or bank card online.|When you must give a copy, write “For [purpose], [date] only” across it.|Under the PDPA 2010 you may ask why a company needs your details. Give only what is required.|Never lend your bank account or SIM to anyone for “a job” or “a favour”. That makes you a mule and you can be prosecuted.","Jangan sekali-kali siar foto MyKad, pasport, pas masuk atau kad bank dalam talian.|Bila perlu beri salinan, tulis “Untuk [tujuan], [tarikh] sahaja” merentasinya.|Di bawah PDPA 2010 anda boleh bertanya mengapa syarikat perlukan maklumat anda. Beri yang perlu sahaja.|Jangan pinjamkan akaun bank atau SIM kepada sesiapa untuk “kerja” atau “tolong”. Itu menjadikan anda akaun keldai dan anda boleh didakwa."]],
[1,2,["Secure your home Wi-Fi and public Wi-Fi use","Selamatkan Wi-Fi rumah dan penggunaan Wi-Fi awam"],["Your router sits between all your devices and the internet. Default passwords are well known.","Router anda berada di antara semua peranti dan internet. Kata laluan lalai mudah diketahui."],["Change the default Wi-Fi and admin passwords on your Unifi, Maxis, CelcomDigi or other router. They are often printed on the sticker.|Use WPA2 or WPA3. Turn off WPS. Put smart gadgets on the Guest Wi-Fi.|In malls, airports and cafés, do not log in to banking on public Wi-Fi. Use mobile data.|Turn off auto-join for open networks.","Tukar kata laluan Wi-Fi dan admin lalai pada router Unifi, Maxis, CelcomDigi atau lain-lain. Selalunya dicetak pada pelekat.|Guna WPA2 atau WPA3. Matikan WPS. Letak gajet pintar pada Wi-Fi Tetamu.|Di pusat beli-belah, lapangan terbang dan kafe, jangan log masuk bank melalui Wi-Fi awam. Guna data mudah alih.|Matikan sambung automatik ke rangkaian terbuka."]],
[1,2,["Check for leaks and delete old accounts","Semak kebocoran dan padam akaun lama"],["Every old account is a leak waiting to happen and a way to impersonate you.","Setiap akaun lama ialah kebocoran yang menunggu masa dan jalan untuk menyamar sebagai anda."],["Enter your email at haveibeenpwned.com. Change passwords on any site that leaked.|Delete accounts and apps you no longer use.|Use Apple Hide My Email or Firefox Relay for new sign-ups.|Remove old apps from your “Sign in with Google, Facebook or Apple” list.","Masukkan e-mel anda di haveibeenpwned.com. Tukar kata laluan di laman yang bocor.|Padam akaun dan aplikasi yang tidak digunakan.|Guna Apple Hide My Email atau Firefox Relay untuk pendaftaran baharu.|Buang aplikasi lama daripada senarai “Sign in with Google, Facebook atau Apple”."]],
[2,3,["Use hardware security keys and strongest protection","Guna kunci keselamatan perkakasan dan perlindungan tertinggi"],["A physical key makes phishing almost impossible, because it only works on the real website.","Kunci fizikal menjadikan phishing hampir mustahil, kerana ia hanya berfungsi di laman web sebenar."],["Buy two keys (YubiKey or Google Titan). Register both on email, cloud and your password manager.|Keep the spare in a safe in another place.|iPhone: turn on <b>Lockdown Mode</b> if you may face spyware. Google: join the Advanced Protection Program.|Turn on Apple Advanced Data Protection for iCloud.","Beli dua kunci (YubiKey atau Google Titan). Daftarkan kedua-duanya pada e-mel, awan dan pengurus kata laluan.|Simpan yang satu lagi dalam peti besi di tempat lain.|iPhone: hidupkan <b>Lockdown Mode</b> jika anda mungkin menghadapi perisian pengintip. Google: sertai Advanced Protection Program.|Hidupkan Apple Advanced Data Protection untuk iCloud."]],
[2,3,["Separate your identities and encrypt your devices","Asingkan identiti dan sulitkan peranti anda"],["If one account or device is compromised, the rest stay safe.","Jika satu akaun atau peranti digodam, selebihnya kekal selamat."],["Use separate browser profiles and email addresses for work, personal, banking and public pages.|Use a non-admin account for daily computer use.|Turn on full-disk encryption: BitLocker (Windows Pro) or FileVault (Mac).|Follow your agency or company ICT security policy. Handle official matters on official channels, not personal apps.","Guna profil pelayar dan alamat e-mel berasingan untuk kerja, peribadi, bank dan halaman awam.|Guna akaun bukan admin untuk kegunaan harian komputer.|Hidupkan penyulitan cakera penuh: BitLocker (Windows Pro) atau FileVault (Mac).|Patuhi polisi keselamatan ICT agensi atau syarikat anda. Urus hal rasmi melalui saluran rasmi, bukan aplikasi peribadi."]],
[2,3,["Verify people and protect your sources","Sahkan identiti orang dan lindungi sumber anda"],["Deepfake voices and fake officials are used against public figures, journalists and executives.","Suara deepfake dan pegawai palsu digunakan terhadap tokoh awam, wartawan dan eksekutif."],["Confirm money or data requests on a second channel. Agree a code word with family and team.|Use Signal for sensitive chats and compare safety numbers in person.|Journalists: use disappearing messages and strip metadata from documents and photos before sending.|Encrypt sensitive files (Cryptomator, VeraCrypt).","Sahkan permintaan wang atau data melalui saluran kedua. Setuju satu kata kod dengan keluarga dan pasukan.|Guna Signal untuk sembang sensitif dan bandingkan nombor keselamatan secara bersemuka.|Wartawan: guna mesej hilang sendiri dan buang metadata dokumen dan foto sebelum hantar.|Sulitkan fail sensitif (Cryptomator, VeraCrypt)."]],
[2,3,["Stop doxxing, plan for incidents, and know where to report","Elak doxxing, rancang insiden, dan tahu tempat melapor"],["When something goes wrong you will not think clearly. A written plan lets you act fast.","Bila sesuatu berlaku anda tidak dapat berfikir jelas. Pelan bertulis membolehkan anda bertindak pantas."],["Search your name, number and address online. Ask sites to remove them. Use a business number for public contact.|Before risky trips or protests: back up, then carry a clean phone. Power it off before checks.|Write your plan: who to call, which accounts to lock first, your bank hotlines.|Report to Cyber999 (CyberSecurity Malaysia), your ICT unit and, for crimes, PDRM.","Cari nama, nombor dan alamat anda dalam talian. Minta laman membuangnya. Guna nombor perniagaan untuk hubungan awam.|Sebelum perjalanan berisiko atau protes: sandarkan data, bawa telefon bersih. Matikan sebelum pemeriksaan.|Tulis pelan anda: siapa dihubungi, akaun mana dikunci dahulu, talian bank anda.|Lapor kepada Cyber999 (CyberSecurity Malaysia), unit ICT anda dan, untuk jenayah, PDRM."]],
[3,1,["Keep cash and paper contacts","Simpan wang tunai dan kenalan atas kertas"],["E-wallets, DuitNow and card machines stop when networks or power go down.","E-dompet, DuitNow dan mesin kad terhenti bila rangkaian atau elektrik terputus."],["Keep RM200 to RM500 in small notes at home.|Write numbers for family, doctor, bank, employer and neighbours on paper. Keep one copy in your wallet and one at home.|Add your bank account numbers and bank hotlines to the same page.","Simpan RM200 hingga RM500 dalam wang kecil di rumah.|Tulis nombor keluarga, doktor, bank, majikan dan jiran atas kertas. Simpan satu salinan dalam dompet dan satu di rumah.|Tambah nombor akaun bank dan talian bank pada helaian yang sama."]],
[3,1,["Prepare for power cuts and floods","Bersedia untuk bekalan elektrik terputus dan banjir"],["The northeast monsoon brings floods and long outages to many states from November to March. Storms can cut power and data at any time.","Monsun Timur Laut membawa banjir dan gangguan lama di banyak negeri dari November hingga Mac. Ribut boleh memutuskan elektrik dan data pada bila-bila masa."],["Keep power banks charged, plus a torch and spare batteries. TNB fault line: <b>15454</b>.|Put IC, passport, certificates, insurance papers, prescriptions and a thumb drive in a waterproof bag, ready to grab.|Before a flood: charge everything, lift devices and documents high, and know your nearest relief centre (PPS).|Follow MetMalaysia and Public InfoBanjir (JPS) for warnings.","Pastikan power bank dicas, serta lampu suluh dan bateri ganti. Talian kerosakan TNB: <b>15454</b>.|Letak IC, pasport, sijil, kertas insurans, preskripsi dan pemacu USB dalam beg kalis air, sedia untuk dicapai.|Sebelum banjir: cas semua peranti, naikkan peranti dan dokumen ke tempat tinggi, dan tahu pusat pemindahan (PPS) terdekat.|Ikuti MetMalaysia dan Public InfoBanjir (JPS) untuk amaran."]],
[3,1,["Get a radio, offline maps and a family plan","Sediakan radio, peta luar talian dan pelan keluarga"],["Radio and paper work when mobile data, cell towers and Wi-Fi do not.","Radio dan kertas berfungsi bila data mudah alih, menara telefon dan Wi-Fi tidak berfungsi."],["Buy a battery or hand-crank AM/FM radio with spare batteries. Tune it to a local station for news.|Google Maps: profile › <b>Offline maps</b> › download your state. Or install Organic Maps.|Choose two meeting places and one relative far away as the “contact person”. Agree check-in times such as 8am and 8pm.|Make sure children know a parent’s number by heart.","Beli radio AM/FM bateri atau engkol tangan dan bateri ganti. Tala ke stesen tempatan untuk berita.|Google Maps: profil › <b>Peta luar talian</b> › muat turun negeri anda. Atau pasang Organic Maps.|Pilih dua tempat berkumpul dan seorang saudara yang jauh sebagai “orang perhubungan”. Setuju masa semak seperti 8 pagi dan 8 malam.|Pastikan anak tahu nombor ibu bapa dengan hafal."]],
[3,2,["Learn offline messaging and walkie-talkies","Belajar mesej luar talian dan walkie-talkie"],["Some tools let phones and radios talk with no internet at all.","Sesetengah alat membolehkan telefon dan radio berhubung tanpa internet langsung."],["Install Briar or Bitchat on family phones and test them now. They chat over Bluetooth.|Walkie-talkies need no network. Check MCMC rules on what is allowed before you buy.|Download Kiwix (offline Wikipedia) and first-aid guides.|Save offline installers for your password manager and maps on a USB drive.","Pasang Briar atau Bitchat pada telefon keluarga dan cuba sekarang. Ia berbual melalui Bluetooth.|Walkie-talkie tidak perlukan rangkaian. Semak peraturan MCMC tentang yang dibenarkan sebelum membeli.|Muat turun Kiwix (Wikipedia luar talian) dan panduan pertolongan cemas.|Simpan pemasang luar talian pengurus kata laluan dan peta pada pemacu USB."]],
[3,3,["Build a long-range kit","Bina set jarak jauh"],["For first responders, journalists and rural users who must reach people with no network.","Untuk pasukan penyelamat, wartawan dan pengguna luar bandar yang perlu menghubungi orang tanpa rangkaian."],["Meshtastic radios send text over several kilometres without towers. Check frequency rules with MCMC.|Satellite messaging devices work in remote areas. Check cost and local rules.|Amateur (ham) radio needs a licence from MCMC.|Keep a router and small server on a battery backup for chat and files inside your home or office.","Radio Meshtastic menghantar teks sejauh beberapa kilometer tanpa menara. Semak peraturan frekuensi dengan MCMC.|Peranti mesej satelit berfungsi di kawasan terpencil. Semak kos dan peraturan tempatan.|Radio amatur memerlukan lesen daripada MCMC.|Simpan router dan pelayan kecil dengan bateri sandaran untuk sembang dan fail dalam rumah atau pejabat."]]
